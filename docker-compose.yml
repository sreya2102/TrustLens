version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: trustlens_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: trustlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustlens_fastapi_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/trustlens
      - DEBUG_MODE=False
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
